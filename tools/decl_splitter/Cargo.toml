[package]
name = "decl-splitter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "decl-splitter"
path = "src/main.rs"

[[bin]]
name = "decl-lattice"
path = "src/lattice.rs"

[[bin]]
name = "decl-patterns"
path = "src/patterns.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
petgraph = "0.7"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
toml = "0.8"
walkdir = "2.5"
ciborium = "0.2"
sha2 = "0.10"
chrono = "0.4"
multibase = "0.9"
