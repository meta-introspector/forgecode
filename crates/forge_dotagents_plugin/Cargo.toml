[package]
name = "forge_dotagents_plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Dotagents ZOS Plugin - Agent Configuration Manager for Forge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/soorya-u/dotagents"

[lib]
name = "forge_dotagents_plugin"
crate-type = ["cdylib"]

[dependencies]
libloading = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
forge_infra = { workspace = true }
forge_domain = { workspace = true }

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true