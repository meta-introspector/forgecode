[package]
name = "lean4_prover_plugin"
version = "0.1.0"
edition = "2024"
description = "Lean4 Prover ZOS Plugin - Formal verification for Forge"
license = "MIT OR Apache-2.0"

[lib]
name = "lean4_prover_plugin"
crate-type = ["cdylib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
forge_infra = { workspace = true }
forge_domain = { workspace = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true